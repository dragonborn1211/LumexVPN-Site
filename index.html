<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LumexVPN</title>
<meta name="description" content="LumexVPN — быстрый и безопасный VPN-клиент." />
<link rel="icon" href="/assets/icon.png" />
<style>
  :root {
    --bg: #0A0E1A;
    --card: #111419;
    --pink: #FF4D8D;
    --orange: #FF9A00;
    --purple: #9B5CFF;
    --cyan: #00E5FF;
    --text-secondary: rgba(255,255,255,0.45);
    --text-muted: rgba(255,255,255,0.30);
    --divider: rgba(255,255,255,0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    width: 96px;
    height: 96px;
    border-radius: 24px;
    object-fit: cover;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0 0 12px;
    background: linear-gradient(90deg, #fff 0%, #fff 42%, var(--pink) 60%, var(--purple) 80%, var(--cyan) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.tagline {
    color: var(--text-secondary);
    font-size: 16px;
    margin: 0 0 40px;
  }
  .links {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .links a {
    color: #fff;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--divider);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s;
  }
  .links a:hover { border-color: var(--pink); }
  footer {
    margin-top: 64px;
    color: var(--text-muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <img class="logo" src="/assets/icon.png" alt="LumexVPN" />
  <h1>LumexVPN</h1>
  <p class="tagline">Поток света и энергии. Без границ.</p>
  <nav class="links">
    <a href="/privacy/">Политика конфиденциальности</a>
    <a href="https://t.me/lumexconnect_bot">Поддержка</a>
  </nav>
  <footer>&copy; 2026 LumexVPN</footer>
</body>
</html>
